name: Verify Mini HRM
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'intl, mbstring, mysqli, sqlite3, bcmath, zip, gd, dom', coverage: none}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: composer install --working-dir=backend --no-interaction --prefer-dist
      - run: php scripts/test-php.php --no-coverage
      - run: PHP_BINARY=php node tests/api.integration.mjs
      - run: php backend/spark hrm:openapi
      - uses: actions/upload-artifact@v4
        with: {name: api-verification, path: tests/results/}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm test --prefix web
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: integration-password, MYSQL_DATABASE: minihrm_test}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pintegration-password" --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'intl, mbstring, mysqli, sqlite3, bcmath, zip, gd, dom', coverage: none}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: composer install --working-dir=backend --no-interaction --prefer-dist
      - run: PHP_BINARY=php node tests/api.integration.mjs
        env:
          HRM_TEST_MYSQL_DB: minihrm_test
          HRM_TEST_MYSQL_PASSWORD: integration-password
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with: {name: android-debug-apk, path: android/app/build/outputs/apk/debug/}
